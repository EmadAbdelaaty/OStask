name: Docker Build and Push

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    # تسجيل الدخول باستخدام Secrets
    - name: Login to DockerHub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/emad-abd-elaaty-2023040155:latest .
        
    - name: Push to DockerHub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/emad-abd-elaaty-2023040155:latest
        
    - name: Success Message
      run: |
        echo "✅ Image pushed successfully!"
        echo "📦 Image: ${{ secrets.DOCKER_USERNAME }}/emad-abd-elaaty-2023040155:latest"